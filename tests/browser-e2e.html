<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Browser E2E harness</title></head>
<body>
  <pre id="result">RUNNING</pre>
  <iframe id="app" src="../index.html" title="予約売上チェッカー" style="width:1100px;height:1000px"></iframe>
  <script type="module">
    import {parseCSV} from '../src/core.mjs';
    const result = document.getElementById('result');
    const frame = document.getElementById('app');
    function check(condition, message) {
      if (!condition) throw new Error(message);
    }
    async function until(predicate, message) {
      for (let i=0; i<200; i++) {
        if (predicate()) return;
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      throw new Error('Timeout: ' + message);
    }
    function upload(doc, text, filename) {
      const input = doc.getElementById('file');
      const transfer = new DataTransfer();
      transfer.items.add(new File([text], filename, {type:'text/csv'}));
      input.files = transfer.files;
      input.dispatchEvent(new Event('change', {bubbles:true}));
    }
    try {
      // An iframe starts with a complete about:blank document before navigation.
      // Wait for the actual application DOM rather than readyState alone.
      await until(() => frame.contentDocument?.getElementById('demo') &&
        frame.contentDocument?.getElementById('analyze') &&
        frame.contentDocument?.location?.pathname === '/index.html' &&
        frame.contentDocument?.readyState === 'complete', 'production iframe and module scripts');
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      const el = id => doc.getElementById(id);
      check(el('demo') && el('analyze'), 'production UI did not load');

      // Real browser DOM events, module imports and asynchronous analysis.
      await until(() => {
        el('demo').click();
        return !el('mappingsection').hidden;
      }, 'demo mapping after app handlers are installed');
      el('analyze').click();
      await until(() => !el('resultsection').hidden, 'demo analysis');
      check(el('total').textContent === '5', 'demo row count');
      check(el('ok').textContent === '1', 'demo safe candidate count');
      check(el('review').textContent === '4', 'demo review count');
      check(el('candidate-yen').textContent === '1,200 円', 'demo candidate total');
      check(el('review-yen').textContent === '6,700 円', 'demo review total');
      check(el('unknown-amounts').textContent === '0 件', 'demo unreadable amount count');
      check(el('reason-preview').rows.length === 2, 'review reason breakdown missing');
      check(el('reason-preview').textContent.includes('ファイル内の取引ID重複'),
        'duplicate reason not shown');

      // Exercise the actual browser download path and inspect its Blob.
      let downloaded;
      const originalCreate = win.URL.createObjectURL.bind(win.URL);
      win.URL.createObjectURL = blob => {
        downloaded = blob;
        return originalCreate(blob);
      };
      el('downloadreasons').click();
      await until(() => downloaded instanceof win.Blob, 'review summary download Blob');
      const reasonRows = parseCSV((await downloaded.text()).replace(/^\uFEFF/, ''));
      check(reasonRows.length === 3, 'reason CSV must have header and two reasons');
      const reasonMap = new Map(reasonRows.slice(1).map(row => [row[0], row]));
      check(reasonMap.get('キャンセル・返金・未決済等の確認が必要')?.[1] === '2',
        'payment review reason count');
      check(reasonMap.get('キャンセル・返金・未決済等の確認が必要')?.[2] === '5000',
        'payment review reason amount');
      check(reasonMap.get('ファイル内の取引ID重複')?.[2] === '1700',
        'duplicate review reason amount');
      check(!reasonRows.flat().join(',').includes('D004'), 'review summary leaks transaction IDs');
      downloaded = undefined;
      check(!el('downloadreview').disabled, 'review-only export should be enabled');
      el('downloadreview').click();
      await until(() => downloaded instanceof win.Blob, 'review-only download Blob');
      const reviewRows = parseCSV((await downloaded.text()).replace(/^\\uFEFF/, ''));
      check(reviewRows.length === 5, 'review-only CSV must have header and four review rows');
      check(reviewRows[0][0] === '元CSV行' && reviewRows[0][6] === '判定',
        'review-only CSV must keep original report schema');
      check(reviewRows.slice(1).every(row => row[6] === '要確認'),
        'review-only export included a candidate');
      check(!reviewRows.flat().join(',').includes('D001'), 'review-only CSV leaked a candidate');
      check(reviewRows.slice(1).filter(row => row[1] === 'D004').length === 2,
        'review-only CSV lost duplicate rows');
      downloaded = undefined;
      el('debit').value = '普通預金';
      el('credit').value = '売上高';
      el('debit').dispatchEvent(new Event('input', {bubbles:true}));
      el('credit').dispatchEvent(new Event('input', {bubbles:true}));
      check(!el('journalaudit').hidden, 'preflight panel is hidden');
      check(el('journalaudit').textContent.includes('税区分が未設定'), 'tax warning missing');
      check(el('journalaudit').textContent.includes('取引Noが未設定'), 'duplicate import warning missing');
      check(el('downloadledger').disabled, 'unconfirmed download enabled');
      el('confirm').click();
      check(!el('downloadledger').disabled, 'confirmed download disabled');
      el('downloadledger').click();
      await until(() => downloaded instanceof win.Blob, 'CSV download Blob');
      const journal = parseCSV(await downloaded.text().then(s => s.replace(/^\uFEFF/, '')));
      check(journal.length === 2, 'journal must include header and only one eligible row');
      check(journal[0].length === 27 && journal[1].length === 27, 'MF journal must be 27 columns');
      check(journal[1][18].includes('D001'), 'unexpected demo transaction exported');
      // Changing the account after confirmation must require a fresh confirmation.
      el('credit').value = '売掛金';
      el('credit').dispatchEvent(new Event('input', {bubbles:true}));
      check(!el('confirm').checked && el('downloadledger').disabled,
        'account change did not revoke prior confirmation');

      // Real File API upload, independent payment/booking statuses, cancellation.
      const bookingCSV = [
        '予約ID,決済日,決済金額,支払ステータス,ステータス,メニュー',
        'C1,2026/10/01,1000,決済済,キャンセル済,取消',
        'C2,2026/10/02,1500,決済済,予約確定,通常',
        'C3,2026/10/03,1500,決済済,承認待ち,未承認',
        'C4,2026/10/04,1500,決済済,不明,要調査'
      ].join('\n');
      upload(doc, bookingCSV, 'booking-synthetic.csv');
      await until(() => el('fileinfo').textContent.includes('booking-synthetic.csv'), 'synthetic file upload');
      check(el('map-status').value === '支払ステータス', 'payment status mapped incorrectly');
      check(el('map-bookingStatus').value === 'ステータス', 'booking status mapped incorrectly');
      check(el('resultsection').hidden, 'old demo results remain visible');
      // A user can accidentally map one column to two financial meanings.
      // The UI must refuse analysis and keep any previous export disabled.
      el('map-amount').value = el('map-id').value;
      el('map-amount').dispatchEvent(new Event('change', {bubbles:true}));
      el('analyze').click();
      await until(() => !el('feedback').hidden, 'duplicate mandatory mapping error');
      check(el('feedback').textContent.includes('異なる4つの必須列'), 'duplicate mapping was accepted');
      check(el('resultsection').hidden && el('downloadledger').disabled,
        'invalid mapping exposed a journal export');
      el('map-amount').value = '決済金額';
      el('map-amount').dispatchEvent(new Event('change', {bubbles:true}));
      el('analyze').click();
      await until(() => !el('resultsection').hidden, 'synthetic analysis');
      check(el('ok').textContent === '1' && el('review').textContent === '3', 'cancelled, pending or unknown paid booking not blocked');
      check(el('candidate-yen').textContent === '1,500 円', 'booking candidate total');
      check(el('review-yen').textContent === '4,000 円', 'booking review total');
      check(el('preview').textContent.includes('キャンセル済'), 'booking status not shown in UI');

      // Invalid replacement must clear previous results and disable export.
      upload(doc, '予約ID,決済日\n"x"oops,2026/10/01', 'malformed.csv');
      await until(() => !el('feedback').hidden, 'malformed file error');
      check(el('resultsection').hidden && el('ledgersection').hidden, 'stale result exposed after upload failure');
      check(el('downloadledger').disabled, 'stale export enabled after upload failure');
      check(el('downloadreview').disabled, 'stale review-only export enabled after upload failure');

      // No external resources loaded by the app during the test.
      const resources = [
        ...performance.getEntriesByType('resource'),
        ...win.performance.getEntriesByType('resource')
      ];
      check(resources.length >= 3, 'resource observation did not run');
      check(resources.every(entry => new URL(entry.name).origin === location.origin),
        'external resource request observed');

      result.textContent = 'PASS: demo, journal download, cancellation, failed upload, local-only resources';
    } catch (error) {
      result.textContent = 'FAIL: ' + (error.stack || error.message || String(error));
    }
  </script>
</body>
</html>
