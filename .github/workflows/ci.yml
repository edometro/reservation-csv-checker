name: Unit and browser tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - run: npm test
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
