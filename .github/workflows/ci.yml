name: Unit and browser tests
on:
  # Feature branches are validated by the pull_request event, not twice on push + PR.
  push:
    branches: [main]
  pull_request:

# Superseded PR commits should not consume runner time or create noisy failures.
# Never cancel a main-branch verification when another commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - run: npm test
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
